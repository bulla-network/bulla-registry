name: Validate

# Required check for PRs to main (the "Required checks" ruleset): the committed exports must consolidate.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Check the pull script
        run: bash -n scripts/pull-and-copy.sh

      # Fails if the result doesn't match registry.schema.json, before anything else runs.
      - name: Consolidate the committed exports
        run: npm run consolidate

      - name: Test the checks
        run: npm test

      # registry.json and CLAUDE.md are generated: a PR must commit what the exports produce.
      # generatedAt changes on every run, so it is ignored.
      - name: Committed registry.json matches the exports
        run: |
          if ! git diff --exit-code -I '"generatedAt":' -- registry.json CLAUDE.md; then
            echo "::error::registry.json or CLAUDE.md is out of date. Run npm run consolidate and commit the result."
            exit 1
          fi
